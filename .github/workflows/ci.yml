name: Agent Metrics Collector CI

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Package in Editable Mode
        run: python -m pip install -e .

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Static Syntax Compilation
        run: python -m compileall -q src tests

      - name: Repository Secret Scan Gate
        run: python -m agent_metrics internal-scan-secrets --path .

      - name: Verify CLI Process Exit Codes (Windows)
        shell: powershell
        run: |
          & python -m agent_metrics doctor --json
          $code = $LASTEXITCODE
          if ($code -ne 2) { Write-Error "Expected exit 2 for module doctor, got $code"; exit 1 }

          & agent-metrics doctor --json
          $code = $LASTEXITCODE
          if ($code -ne 2) { Write-Error "Expected exit 2 for console doctor, got $code"; exit 1 }

          & powershell -NoProfile -ExecutionPolicy Bypass -File .\agent-metrics.ps1 doctor --json
          $code = $LASTEXITCODE
          if ($code -ne 2) { Write-Error "Expected exit 2 for ps1 doctor, got $code"; exit 1 }

          & python -m agent_metrics finish "bad id"
          $code = $LASTEXITCODE
          if ($code -ne 4) { Write-Error "Expected exit 4 for module finish bad id, got $code"; exit 1 }

          & agent-metrics finish "bad id"
          $code = $LASTEXITCODE
          if ($code -ne 4) { Write-Error "Expected exit 4 for console finish bad id, got $code"; exit 1 }

          & powershell -NoProfile -ExecutionPolicy Bypass -File .\agent-metrics.ps1 finish "bad id"
          $code = $LASTEXITCODE
          if ($code -ne 4) { Write-Error "Expected exit 4 for ps1 finish bad id, got $code"; exit 1 }

          exit 0

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Package in Editable Mode
        run: python -m pip install -e .

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Static Syntax Compilation
        run: python -m compileall -q src tests

      - name: Repository Secret Scan Gate
        run: python -m agent_metrics internal-scan-secrets --path .

      - name: Verify CLI Process Exit Codes (Ubuntu)
        shell: bash
        run: |
          set +e
          python -m agent_metrics doctor --json > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 2 ]; then echo "Expected exit 2 for module doctor, got $code"; exit 1; fi

          agent-metrics doctor --json > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 2 ]; then echo "Expected exit 2 for console doctor, got $code"; exit 1; fi

          python -m agent_metrics finish "bad id" > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 4 ]; then echo "Expected exit 4 for module finish bad id, got $code"; exit 1; fi

          agent-metrics finish "bad id" > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 4 ]; then echo "Expected exit 4 for console finish bad id, got $code"; exit 1; fi
          set -e
