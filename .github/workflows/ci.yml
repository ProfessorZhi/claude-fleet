name: Agent Metrics Collector CI

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Static Syntax Compilation
        run: python -m compileall -q src tests

      - name: Repository Secret Scan Gate
        run: python -m agent_metrics internal-scan-secrets --path .

      - name: Test PowerShell Launcher
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\agent-metrics.ps1 doctor --json

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Static Syntax Compilation
        run: python -m compileall -q src tests

      - name: Repository Secret Scan Gate
        run: python -m agent_metrics internal-scan-secrets --path .
